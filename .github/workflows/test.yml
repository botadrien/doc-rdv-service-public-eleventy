name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (markdown-it-dsfr + sérialisation dsfr-editor + typecheck)
        run: npm test
      - name: Build de vérification
        run: npm run build
      - name: Filet de sécurité format dsfr-editor
        run: node scripts/check-build.mjs
